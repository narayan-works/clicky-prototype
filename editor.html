<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>hey clicky - Edited</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      document.addEventListener("mousemove", function (e) {
        if (window.parent !== window) {
          window.parent.postMessage({ type: "clicky-cursor", x: e.clientX, y: e.clientY }, window.location.origin);
        }
      });
    </script>
  </body>
</html>
